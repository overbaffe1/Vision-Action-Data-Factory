<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Сравнение smoke-прогона и полного рецепта обучения по логарифмической шкале">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1B1B1F; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #1B1B1F; }
      .muted { fill: #6B7280; }
      .faint { fill: #9CA3AF; }
      .metric { font-size: 13px; font-weight: 600; }
      .hint { font-size: 11px; }
      .val { font-size: 12.5px; }
      .grid { stroke: #EAE5DC; stroke-width: 1; }
      .axis { stroke: #D6D0C6; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#FBF9F6"/>

  <text class="t faint" x="24" y="30" font-size="9.5" letter-spacing="1.4">ДИАГНОЗ · IMPROVE.md</text>
  <text class="t" x="24" y="56" font-size="19" font-weight="600" letter-spacing="-0.01em">В архиве — smoke-прогон, а не обученная политика</text>

  <g>
    <rect x="806" y="30" width="370" height="34" rx="17" fill="#FFFFFF" stroke="#E3DED5"/>
    <text class="t muted" x="826" y="51" font-size="11.5">Score =</text>
    <text class="m" x="880" y="51" font-size="12">100 · (0.4·VLM + 0.6·VLA)</text>
  </g>

  <!-- легенда -->
  <g>
    <rect x="24" y="82" width="10" height="10" rx="2" fill="#E5484D"/>
    <text class="t muted" x="42" y="91" font-size="11.5">как в сабмите (smoke)</text>
    <rect x="182" y="82" width="10" height="10" rx="2" fill="#2EA44F"/>
    <text class="t muted" x="200" y="91" font-size="11.5">полный рецепт организаторов</text>
    <text class="t faint" x="1176" y="91" font-size="10.5" text-anchor="end">шкала логарифмическая</text>
  </g>

  <!-- сетка -->
  <g class="grid">
    <path d="M320 112 V 336"/><path d="M466 112 V 336"/><path d="M612 112 V 336"/>
    <path d="M758 112 V 336"/><path d="M904 112 V 336"/><path d="M1050 112 V 336"/>
  </g>
  <g class="faint" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">
    <text x="320" y="352">1</text><text x="466" y="352">10</text><text x="612" y="352">100</text>
    <text x="758" y="352">1k</text><text x="904" y="352">10k</text><text x="1050" y="352">100k</text>
  </g>

  <!-- строки -->
  <g>
    <!-- шаги -->
    <text class="t metric" x="24" y="132">шаги обучения</text>
    <text class="t faint hint" x="24" y="147">training.steps</text>
    <rect x="320" y="120" width="146" height="11" rx="3" fill="#E5484D"/>
    <text class="m val" x="474" y="130">10</text>
    <rect x="320" y="136" width="581" height="11" rx="3" fill="#2EA44F"/>
    <text class="m val" x="909" y="146">30 000</text>

    <!-- эпизоды -->
    <text class="t metric" x="24" y="190">эпизодов в датасете</text>
    <text class="t faint hint" x="24" y="205">dataset.repo_id</text>
    <rect x="320" y="178" width="102" height="11" rx="3" fill="#E5484D"/>
    <text class="m val" x="430" y="188">5</text>
    <rect x="320" y="194" width="471" height="11" rx="3" fill="#2EA44F"/>
    <text class="m val" x="799" y="204">1 693</text>

    <!-- batch -->
    <text class="t metric" x="24" y="248">batch size</text>
    <text class="t faint hint" x="24" y="263">training.batch_size</text>
    <rect x="320" y="236" width="88" height="11" rx="3" fill="#E5484D"/>
    <text class="m val" x="416" y="246">1</text>
    <rect x="320" y="252" width="112" height="11" rx="3" fill="#2EA44F"/>
    <text class="m val" x="440" y="262">4</text>

    <!-- chunk -->
    <text class="t metric" x="24" y="306">chunk_size / n_action_steps</text>
    <text class="t faint hint" x="24" y="321">политика SmolVLA</text>
    <rect x="320" y="294" width="132" height="11" rx="3" fill="#E5484D"/>
    <text class="m val" x="460" y="304">8 / 8</text>
    <rect x="320" y="310" width="248" height="11" rx="3" fill="#2EA44F"/>
    <text class="m val" x="576" y="320">50 / 50</text>
  </g>

  <path class="axis" d="M320 336 H 1176"/>

  <text class="t muted" x="24" y="380" font-size="11.5">Два порядка разницы в шагах — отсюда счёт в районе 9.9: это уровень почти случайной политики, а не «модель не учится».</text>
  <text class="t faint" x="1170" y="380" font-size="10.5" text-anchor="end">источник: action_expert/train_config.json</text>
</svg>
