# Default action-expert template for LIBERO (LeRobot v3) — participants may edit freely.
# paths.vlm_checkpoint / paths.dataset_dir / paths.output_dir / runtime are injected.

dataset:
  repo_id: HuggingFaceVLA/libero
  revision: v3.0
  episode_count: 1693
  subset_seed: 1000
  use_imagenet_stats: true
  video_backend: pyav

policy:
  load_vlm_weights: true
  train_expert_only: true
  freeze_vision_encoder: true
  train_state_proj: true
  chunk_size: 50
  n_action_steps: 50
  num_vlm_layers: -1
  num_expert_layers: -1
  expert_width_multiplier: 0.75
  attention_mode: cross_attn
  self_attn_every_n_layers: 2
  device: cuda

optimizer:
  learning_rate: 0.0001
  betas: [0.9, 0.95]
  epsilon: 0.00000001
  weight_decay: 0.0000000001
  grad_clip_norm: 10.0
  warmup_steps: 1000
  decay_steps: 30000
  decay_learning_rate: 0.0000025

training:
  job_name: smolvla-libero-hackathon
  steps: 30000
  batch_size: 4
  num_workers: 16
  seed: 1000
  log_freq: 10
  save_freq: 5000
  resume: false
  resume_config_path: null
