input:
  require_prepared_images: true
  allowed_extensions: [".jpg", ".jpeg"]
  require_rgb: true
  max_side: 768

yolo:
  workers: 1
  batch_size: 16
  devices: ["cuda:0"]
  model: yolov8m.pt

sam2:
  workers: 3
  batch_size: 8
  devices: ["cuda:0"]
  dtype: bfloat16
  empty_cache: true

vlm:
  # ego100k-part-4 (1,486,941 frames), 2-GPU node, 4 fixed VLM targets.
  # max_concurrency is per GPU process -- with 2 GPU processes each backend
  # sees up to 2x this value (32 concurrent per model).
  targets:
    - base_url: "http://odie6.frontierai.ru:7080"
      model: "Qwen3.5-4B-FP8"
      max_concurrency: 16
    - base_url: "http://odie8.frontierai.ru:7080"
      model: "Qwen3.5-4B-FP8"
      max_concurrency: 16
    - base_url: "http://odie9.frontierai.ru:7080"
      model: "Qwen3.5-4B-FP8"
      max_concurrency: 16
    - base_url: "http://odie10.frontierai.ru:7080"
      model: "Qwen3.5-4B-FP8"
      max_concurrency: 16
  workers: 64
  timeout_s: 60

judge:
  enabled: false
  tasks: ["bboxing", "pointing"]
  workers: 0
  endpoints: []

validation:
  bbox:
    out_of_bounds_policy: "reject"
    min_box_area_px: 4
    max_boxes_per_image: 100
  pointing:
    out_of_bounds_policy: "reject"
    require_point_inside_related_bbox: false
    max_points_per_image: 100
  captions:
    min_length: 5
    max_length: 1000
    forbidden_phrases:
      - "I cannot see the image"
      - "as an AI model"
      - "unable to determine"

retry:
  max_attempts: 3
  backoff_seconds: 30

storage:
  save_raw_vlm_responses: false
  save_yolo_outputs: false
  save_sam2_outputs: false
  save_invalid_outputs: false
  save_validated_copies: false
  save_visualizations: false
