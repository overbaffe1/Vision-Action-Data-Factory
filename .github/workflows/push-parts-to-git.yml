name: Push submission parts to git tree

# Забирает submission.zip.part.* из GitHub Release (runner → runner, быстро),
# проверяет целостность zip (CRC), нарезает на чанки <100MiB (лимит GitHub на файл)
# и пушит их ПРЯМО В GIT ДЕРЕВО пачками по ~1.3ГБ (лимит push = 2ГБ).
# После этого submission.zip скачивается обычным `git clone` / `git pull`.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag с submission.zip.part.*'
        required: true
        default: 'submission-20261018-1902'
      chunk_mb:
        description: 'Размер чанка в МиБ (должен быть < 100)'
        required: true
        default: '95'
      force:
        description: 'Пересобрать, даже если submission_parts/ уже есть'
        required: false
        default: 'false'
  push:
    branches:
      - arena/8c48778b-vision-action-data-factory
    paths:
      - '.github/workflows/push-parts-to-git.yml'

jobs:
  push-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/8c48778b-vision-action-data-factory
          fetch-depth: 1

      - name: Guard (skip if already pushed)
        id: guard
        run: |
          n_parts=$(ls submission_parts/part_* 2>/dev/null | wc -l)
          if [ -f submission_parts/MANIFEST.md ] && [ "$n_parts" -gt 0 ] && [ "${{ github.event.inputs.force || 'false' }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::submission_parts/ уже есть в дереве ($n_parts chunks). Для пересборки запусти с force=true."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manifest=$([ -f submission_parts/MANIFEST.md ] && echo yes || echo no) chunks=$n_parts"
          fi

      - name: Download release parts (runner→runner)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          trap 'echo "ERR line=$LINENO cmd=$BASH_COMMAND" >> /tmp/trace.log' ERR
          mkdir -p /tmp/sub
          gh release download "${{ github.event.inputs.release_tag || 'submission-20261018-1902' }}" -R "${{ github.repository }}" -D /tmp/sub -p "submission.zip.part.*"
          ls -la /tmp/sub | tee -a /tmp/trace.log
          for f in /tmp/sub/submission.zip.part.*; do
            echo "$f $(stat -c%s "$f")" | tee -a /tmp/trace.log
          done

      - name: Combine, verify CRC, split into <100MiB chunks
        if: steps.guard.outputs.skip != 'true'
        env:
          CHUNK_MB: ${{ github.event.inputs.chunk_mb || '95' }}
        run: |
          set -e
          trap 'echo "ERR line=$LINENO cmd=$BASH_COMMAND" >> /tmp/trace.log' ERR
          exec > >(tee -a /tmp/trace.log) 2>&1

          # На push-событии inputs пусты — валидируем и подставляем 95
          case "${CHUNK_MB:-}" in ''|*[!0-9]*) echo "CHUNK_MB='${CHUNK_MB:-}' invalid -> 95"; CHUNK_MB=95;; esac
          if [ "$CHUNK_MB" -lt 1 ] || [ "$CHUNK_MB" -gt 99 ]; then echo "CHUNK_MB=$CHUNK_MB out of range -> 95"; CHUNK_MB=95; fi
          echo "CHUNK_MB=$CHUNK_MB"

          echo "== phase 1: combine =="
          cd /tmp/sub
          mkdir -p "$GITHUB_WORKSPACE/submission_parts"
          cat submission.zip.part.0* > submission.zip
          rm -f submission.zip.part.0*
          ls -la /tmp/sub

          echo "== phase 2: verify zip (CRC + listing + md5) =="
          TARGET_DIR="$GITHUB_WORKSPACE/submission_parts" python3 - <<'PYEOF'
          import os, zipfile, hashlib, sys
          target = os.environ['TARGET_DIR']
          try:
              z = zipfile.ZipFile('submission.zip')
              names = z.namelist()
              print(f"{len(names)} entries")
              lines = []
              for n in names:
                  i = z.getinfo(n)
                  lines.append(f"{i.file_size:12d}  {n}")
              open(os.path.join(target, 'zip_listing.txt'), 'w').write("\n".join(lines) + "\n")
              for l in lines[:40]:
                  print(l)
              bad = z.testzip()
              print("CRC:", "OK" if bad is None else f"BAD {bad}")
              if bad is not None:
                  print("CRC FAILED on", bad)
                  sys.exit(2)
          except zipfile.BadZipFile as e:
              print("BadZipFile:", e)
              sys.exit(3)
          h = hashlib.md5()
          with open('submission.zip', 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 24), b''):
                  h.update(chunk)
          md5 = h.hexdigest()
          print("ZIP_MD5", md5)
          open(os.path.join(target, 'zip_md5.txt'), 'w').write(md5 + "\n")
          PYEOF

          echo "== phase 3: split into ${CHUNK_MB}M chunks =="
          split -b "${CHUNK_MB}M" -d -a 4 submission.zip "$GITHUB_WORKSPACE/submission_parts/part_"
          rm -f /tmp/sub/submission.zip
          cd "$GITHUB_WORKSPACE/submission_parts"
          ls -la part_*

          echo "== phase 4: manifest + scripts (python) =="
          python3 - <<'PYEOF'
          import os, hashlib, glob, stat
          d = os.getcwd()
          chunks = sorted(glob.glob(os.path.join(d, 'part_*')))
          print(f"{len(chunks)} chunks")
          chunk_lines = []
          total = 0
          for c in chunks:
              h = hashlib.md5()
              size = 0
              with open(c, 'rb') as f:
                  for blk in iter(lambda: f.read(1 << 24), b''):
                      h.update(blk)
                      size += len(blk)
              total += size
              chunk_lines.append(f"{h.hexdigest()}  {os.path.basename(c)}")
              print(os.path.basename(c), size)
          open(os.path.join(d, 'chunk_md5.txt'), 'w').write("\n".join(chunk_lines) + "\n")
          zip_md5 = open(os.path.join(d, 'zip_md5.txt')).read().strip() if os.path.exists(os.path.join(d, 'zip_md5.txt')) else 'unknown'
          listing = open(os.path.join(d, 'zip_listing.txt')).read() if os.path.exists(os.path.join(d, 'zip_listing.txt')) else '(missing)'
          names = [os.path.basename(c) for c in chunks]

          bat = ["@echo off", "cd /d %~dp0", "copy /b " + "+".join(names) + " ..\\submission.zip", "echo Done. ..\\submission.zip", ""]
          open(os.path.join(d, 'reassemble.bat'), 'w').write("\n".join(bat))

          sh = ["#!/usr/bin/env bash", "set -e", 'cd "$(dirname "$0")"', "cat " + " ".join(names) + " > ../submission.zip", 'echo "MD5: $(md5sum ../submission.zip)"', 'echo "Size: $(stat -c%s ../submission.zip) bytes"', ""]
          open(os.path.join(d, 'reassemble.sh'), 'w').write("\n".join(sh))
          os.chmod(os.path.join(d, 'reassemble.sh'), 0o755)

          man = []
          man.append("# submission.zip — сборка из частей\n")
          man.append("Сборка `submission.zip` из чанков `part_00..part_%02d` (каждый < 100 МиБ, лимит GitHub на файл).\n" % (len(names) - 1))
          man.append("## Быстрая сборка\n")
          man.append("```bat")
          man.append(":: Windows (CMD), из папки submission_parts:")
          man.append("reassemble.bat")
          man.append("```\n")
          man.append("```bash")
          man.append("# Linux / macOS / Git Bash:")
          man.append("./reassemble.sh")
          man.append("# или вручную:")
          man.append("cat submission_parts/part_* > submission.zip")
          man.append("```\n")
          man.append("## Контрольные суммы\n")
          man.append("ZIP_MD5 `%s` (полный размер %d байт)\n" % (zip_md5, total))
          man.append("### Чанки (md5)\n")
          man.append("```")
          man.extend(chunk_lines)
          man.append("```\n")
          man.append("## Содержимое submission.zip\n")
          man.append("```")
          man.extend(listing.splitlines()[:60])
          man.append("```\n")
          man.append("Полный листинг: [zip_listing.txt](zip_listing.txt)")
          open(os.path.join(d, 'MANIFEST.md'), 'w').write("\n".join(man) + "\n")
          print("MANIFEST written, total bytes:", total)
          PYEOF
          echo "== all phases done =="

      - name: Commit and push in <2GB batches
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          trap 'echo "ERR line=$LINENO cmd=$BASH_COMMAND" >> /tmp/trace.log' ERR
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 1073741824
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999

          push_branch () {
            local a ok=0
            for a in 1 2 3; do
              if git push origin HEAD:arena/8c48778b-vision-action-data-factory; then ok=1; break; fi
              echo "push attempt $a failed, retrying in 20s..." | tee -a /tmp/trace.log
              sleep 20
            done
            [ "$ok" -eq 1 ]
          }

          # 0) убрать debug-лог прошлых падений, если был
          git rm -f --ignore-unmatch submission_parts_debug.log || true
          # 1) маленький коммит: манифест + скрипты (идемпотентно: мог быть закоммичен в прошлом run)
          git add submission_parts/MANIFEST.md submission_parts/reassemble.bat submission_parts/reassemble.sh submission_parts/zip_md5.txt submission_parts/zip_listing.txt submission_parts/chunk_md5.txt
          git diff --cached --quiet && echo "manifest unchanged" || {
            git commit -m "submission_parts: manifest + reassemble scripts (submission.zip from release ${{ github.event.inputs.release_tag || 'submission-20261018-1902' }})"
            push_branch
          }

          # 2) чанки пачками по 5 шт (~475МБ на push — мелкие push'и не ловят 408)
          parts=($(ls submission_parts/part_* | sort))
          total=${#parts[@]}
          echo "total chunks: $total"
          i=0
          batch_size=5
          while [ $i -lt $total ]; do
            batch=("${parts[@]:$i:$batch_size}")
            git add "${batch[@]}"
            git commit -m "submission_parts: chunks ${i}..$((i + ${#batch[@]} - 1)) of ${total}"
            echo "pushing batch at $i (${#batch[@]} files)..." | tee -a /tmp/trace.log
            push_branch
            i=$((i + batch_size))
          done
          echo "== all pushed ==" | tee -a /tmp/trace.log
          git log --oneline -12

      - name: Debug trace to repo on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== run ${{ github.run_id }} step failed ==="
            echo "=== trace ==="
            cat /tmp/trace.log 2>/dev/null || echo "(no trace)"
            echo "=== /tmp/sub ==="
            ls -la /tmp/sub 2>/dev/null || true
            echo "=== submission_parts ==="
            ls -la submission_parts 2>/dev/null || true
            echo "=== git log ==="
            git log --oneline -12 2>/dev/null || true
            echo "=== df ==="
            df -h
          } > submission_parts_debug.log 2>&1 || true
          # пишем через REST API (git push тут может тащить незапушенные гигабайты)
          sha=$(gh api "repos/${{ github.repository }}/contents/submission_parts_debug.log?ref=arena/8c48778b-vision-action-data-factory" --jq .sha 2>/dev/null || echo "")
          python3 - "$sha" > /tmp/put.json <<'PYEOF'
          import json, base64, sys
          sha = sys.argv[1] if len(sys.argv) > 1 else ''
          d = {
              "message": "debug trace from failed run ${{ github.run_id }}",
              "content": base64.b64encode(open('submission_parts_debug.log', 'rb').read()).decode(),
              "branch": "arena/8c48778b-vision-action-data-factory",
          }
          if sha:
              d["sha"] = sha
          print(json.dumps(d))
          PYEOF
          gh api -X PUT "repos/${{ github.repository }}/contents/submission_parts_debug.log" --input /tmp/put.json || true

      - name: Summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            echo "## submission_parts запушены в git дерево"
            echo
            echo "- Чанки: \`submission_parts/part_00..part_N\` (по \`${{ github.event.inputs.chunk_mb }}\` МиБ)"
            echo "- Сборка: \`cd submission_parts && reassemble.bat\` (Windows) или \`./reassemble.sh\`"
            echo "- Контрольные суммы: \`submission_parts/MANIFEST.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
